name: Release

# Version changes on main, version tags and manual runs publish to PyPI after the checks in
# ci.yml pass.
# Tag-triggered runs also verify the tag matches hanaikada/version.py.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['hanaikada/version.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # scripts/build_wheel.py reads this: the web type-check runs in ci.yml.
  CI: '1'

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build the wheel
    needs: [checks]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - run: pip install --upgrade build twine

      - name: The tag and hanaikada/version.py agree
        id: version
        run: |
          version=$(python -c "from hanaikada.version import VERSION; print(VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in hanaikada/version.py"
              exit 1
            fi
          fi

      # Builds the web UI with bun first: setuptools packages only the files that exist then.
      - name: Build
        run: python scripts/build_wheel.py --ci

      - name: The wheel carries the web UI
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.startswith("hanaikada/webui/dist/") for n in names), "the wheel has no web UI"
          assert "hanaikada/webui/dist/index.html" in names, "the wheel has no index.html"
          print(wheel.name, f"{wheel.stat().st_size / 1e6:.1f} MB", len(names), "files")
          PY

      - name: Check the metadata
        run: twine check dist/*

      - name: The wheel installs and runs
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --quiet dist/*.whl
          /tmp/probe/bin/hanaikada version
          /tmp/probe/bin/python -c "import hanaikada; print(hanaikada.VERSION)"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment can require an approval before a release.
    environment:
      name: pypi
      url: https://pypi.org/p/hanaikada
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install Twine
        run: python -m pip install --upgrade twine
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: python -m twine upload dist/* --skip-existing --non-interactive

  github-release:
    name: GitHub release
    needs: [build, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Create the release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
